# L'API et sa base PostgreSQL. Les valeurs ${...} viennent du fichier .env.
#
#   docker compose up -d db                    # la base seule (développement local)
#   docker compose up -d                       # la base et l'API
#   docker compose pull && docker compose up -d   # dernière image publiée de l'environnement

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 127.0.0.1 : la base n'est joignable que depuis cette machine, pas depuis le réseau.
    ports:
      - "127.0.0.1:5432:5432"
    # Volume nommé : les données survivent à la suppression du conteneur.
    volumes:
      - donnees_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Image publiée par la CI ; IMAGE_TAG choisit l'environnement (prod par défaut).
    image: ghcr.io/rosinalexis/seattle-energy-api:${IMAGE_TAG:-prod}
    # Sans image publiée, docker compose build la construit depuis ce dépôt.
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${API_KEY}
      # Dans le réseau Compose, la base s'appelle « db », pas « localhost ». L'API se
      # connecte avec son rôle restreint, jamais avec le compte administrateur.
      DATABASE_URL: postgresql+psycopg://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    # L'API vérifie la base au démarrage : elle attend que PostgreSQL soit prêt.
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees_postgres:
